{% extends "base.html" %}

{% block content %}
<style>
  .login-box {
    max-width: 420px;
    margin: 60px auto;
    padding: 36px 40px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,224,255,0.2);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,224,255,0.08);
  }
  .login-box h2 {
    text-align: center;
    color: #00e0ff;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 28px;
  }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #a0aec0;
    font-size: 14px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,224,255,0.2);
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 15px;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #00e0ff;
    box-shadow: 0 0 8px rgba(0,224,255,0.3);
  }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #00ff9c, #00c853);
    border: none;
    border-radius: 30px;
    color: #020617;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 8px;
  }
  .btn-login:hover {
    box-shadow: 0 0 20px rgba(0,255,156,0.5);
    transform: translateY(-2px);
  }
  .login-link {
    text-align: center;
    margin-top: 18px;
    color: #718096;
    font-size: 14px;
  }
  .login-link a { color: #00e0ff; text-decoration: none; }
  .error-msg {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 18px;
    color: #fca5a5;
    font-size: 14px;
  }
</style>

<div class="login-box">
  <h2>🛡 Create Account</h2>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/register">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a password" required>
    </div>
    <button type="submit" class="btn-login">Register</button>
  </form>

  <div class="login-link">
    Already have an account? <a href="/login">Login here</a>
  </div>
</div>
{% endblock %}
